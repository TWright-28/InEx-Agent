line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".npm_doc_cache", "db", "logs"]

[lint]
select = ["E", "F", "I", "B", "UP", "N", "TID"]
ignore = ["E501"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.per-file-ignores]
"tools/**" = ["N"]
"config.py" = ["N"]
"seeder.py" = ["N", "E402"]
"eval.py" = ["N"]
"import_list.py" = ["N", "E402"]
"agent.py" = ["N"]
"tests/test_concurrency.py" = ["N802"]
